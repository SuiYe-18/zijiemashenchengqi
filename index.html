<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>字节码生成器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", Consolas, sans-serif;
        }

        body {
            background-color: #f8f9fa;
            padding: 40px 20px;
        }

        .container {
            max-width: 780px;
            margin: 0 auto;
            background: #ffffff;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.07);
        }

        h1 {
            text-align: center;
            font-size: 28px;
            color: #222;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .control-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: center;
            margin-bottom: 25px;
        }

        .control-bar label {
            font-size: 16px;
            color: #333;
        }

        .control-bar select,
        .control-bar input {
            padding: 9px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            width: 95px;
        }

        button {
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-generate {
            background-color: #0066ff;
            color: #fff;
        }

        .btn-copy {
            background-color: #22c55e;
            color: #fff;
        }

        button:hover {
            opacity: 0.9;
        }

        .result-title {
            font-size: 16px;
            color: #444;
            margin-bottom: 10px;
        }

        #resultBox {
            width: 100%;
            height: 440px;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 18px;
            font-size: 14px;
            resize: none;
            background: #fefefe;
        }

        .img-container {
            margin-top: 25px;
            text-align: center;
        }

        .img-container img {
            max-width: 300px;
            border-radius: 10px;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>字节码生成器</h1>

        <div class="control-bar">
            <label>位宽：</label>
            <select id="bitSel">
                <option value="8">8</option>
                <option value="16">16</option>
                <option value="32">32</option>
                <option value="64">64</option>
            </select>

            <label>数量：</label>
            <input type="number" id="countInput" value="20" min="1" max="5000">

            <button class="btn-generate" onclick="btnGen()">生成字节码</button>
            <button class="btn-copy" onclick="copyAll()">一键复制</button>
        </div>

        <div class="result-title">生成结果：</div>
        <textarea id="resultBox" readonly></textarea>

        <div class="img-container">
            <img src="show.png" alt="生成展示图">
        </div>
    </div>

<script>
// 格式位数配置
const BIT_CFG = {
    8: 2,
    16: 4,
    32: 8,
    64: 16
};
// 每位最大可用不重复数量
const BIT_MAX = {
    8: 256,
    16: 5000,
    32: 5000,
    64: 5000
};
const GLOBAL_MAX = 5000;

function msgAlert(txt) {
    alert(txt);
}

function generateBytes(bitSize, needCnt) {
    // 先取当前位实际上限
    let upper = BIT_MAX[bitSize];
    // 最终要生成的数量
    let realCnt = Math.min(needCnt, upper, GLOBAL_MAX);

    // 超出当前位上限提示
    if (needCnt > upper) {
        msgAlert(`${bitSize}位最多只能生成 ${upper} 个不重复字节码`);
    }

    let hexLen = BIT_CFG[bitSize];
    let result = [];

    // 8位直接顺序生成，不循环随机，绝不卡死
    if (bitSize === 8) {
        for (let i = 0; i < realCnt; i++) {
            let code = "0x" + i.toString(16).toUpperCase().padStart(hexLen, "0");
            result.push(code);
        }
        return result;
    }

    // 16/32/64 随机生成5000个不重复，安全不卡死
    let set = new Set();
    while (set.size < realCnt) {
        let n;
        if (bitSize === 16) {
            n = Math.floor(Math.random() * 65536);
        } else if (bitSize === 32) {
            n = Math.floor(Math.random() * 100000000);
        } else {
            // 64位用大随机安全值
            n = Math.floor(Math.random() * Number.MAX_SAFE_INTEGER);
        }
        let code = "0x" + n.toString(16).toUpperCase().padStart(hexLen, "0");
        set.add(code);
    }
    return Array.from(set).sort();
}

function btnGen() {
    try {
        let bit = parseInt(document.getElementById('bitSel').value);
        let count = parseInt(document.getElementById('countInput').value);

        if (isNaN(count) || count < 1 || count > GLOBAL_MAX) {
            msgAlert("数量必须在 1 ~ 5000 之间");
            return;
        }

        let list = generateBytes(bit, count);
        let out = "";
        list.forEach((item, i) => {
            out += `${i + 1}. ${item}\n`;
        });

        document.getElementById('resultBox').value = out;
    } catch (e) {
        msgAlert("输入错误，请重试");
    }
}

function copyAll() {
    let text = document.getElementById('resultBox').value.trim();
    if (!text) {
        msgAlert("暂无内容可复制");
        return;
    }
    navigator.clipboard.writeText(text).then(() => {
        msgAlert("复制成功！");
    });
}
</script>
</body>
</html>
